name: One-time schedule UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Patch scheduler entry point
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/routes/autoposter.tsx'); s=p.read_text()
          s=s.replace('  ClockCounterClockwise,\n', '  ClockCounterClockwise,\n  CalendarCheck,\n', 1)
          s=s.replace('  const [showAdvanced, setShowAdvanced] = useState(false);', '  const [showAdvanced, setShowAdvanced] = useState(false);\n\n  function openScheduler() {\n    if (!caption.trim()) return setStatus({ type: "error", text: "Generate or write a caption before scheduling." });\n    localStorage.setItem("autoposter:schedule-draft", JSON.stringify({ page, caption, imageUrl }));\n    window.location.href = "/schedule";\n  }', 1)
          old='<a className="icon-button" href="/history" title="Publishing history"><ClockCounterClockwise size={19} /><span className="hidden sm:inline">History</span></a>'
          new=old+'<button className="icon-button" title="Schedule post" onClick={openScheduler} disabled={!!busy}><CalendarCheck size={19} /><span className="hidden sm:inline">Schedule</span></button>'
          if old not in s: raise SystemExit('header anchor not found')
          s=s.replace(old,new,1)
          marker='</main>'
          modal='''{showSettings && null}'''
          # Keep UI simple: scheduler is a dedicated page, launched with the current draft.
          p.write_text(s)
          PY
      - name: Remove this workflow after patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/autoposter.tsx
          git diff --cached --quiet || git commit -m "feat: connect studio to scheduler"
          git push
