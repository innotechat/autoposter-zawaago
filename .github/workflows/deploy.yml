name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify generated Wrangler config
        run: |
          test -f build/server/wrangler.json
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("build/server/wrangler.json","utf8")); console.log("Generated config:", {name:c.name, main:c.main, ai:c.ai, queues:c.queues}); if (c.queues?.producers?.length || c.queues?.consumers?.length) { console.error("Unexpected non-empty Queue configuration detected"); process.exit(1); }'

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
