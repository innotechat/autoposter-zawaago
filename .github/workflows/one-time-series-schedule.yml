name: One-time education series scheduling patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scheduler and studio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('workers/scheduler.ts')
          s = p.read_text()
          marker = 'schedulerRoutes.get("/autoposter/schedules", async (c) => {'
          if '/autoposter/schedules/series' not in s:
              block = r'''schedulerRoutes.post("/autoposter/schedules/series", async (c) => {
            try {
              const body = await c.req.json().catch(() => ({}));
              const pageName = normalizeBrand(String(body.page || body.pageName || "Zawaago"));
              const posts = Array.isArray(body.posts) ? body.posts : [];
              const intervalHours = Number(body.intervalHours || 24);
              const startAt = String(body.startAt || "").trim();
              if (posts.length < 1 || posts.length > 10) return c.json({ error: "Series must contain 1-10 posts." }, 400);
              if (!Number.isFinite(intervalHours) || intervalHours < 1 || intervalHours > 168) return c.json({ error: "Interval must be between 1 and 168 hours." }, 400);
              const start = new Date(startAt);
              if (!startAt || Number.isNaN(start.getTime())) return c.json({ error: "A valid series start date/time is required." }, 400);
              if (start.getTime() <= Date.now() + 30_000) return c.json({ error: "Series start time must be in the future." }, 400);
              const cfg = config(pageName, c.env);
              if (!c.env.ASSETS) return c.json({ error: "Asset storage is not configured." }, 503);
              const schedules: ScheduleRecord[] = [];
              for (let index = 0; index < posts.length; index += 1) {
                const post = posts[index] || {};
                const caption = String(post.caption || "").trim();
                const imageUrl = String(post.imageUrl || "").trim();
                if (!caption) return c.json({ error: `Episode ${index + 1} has no caption.` }, 400);
                if (Boolean(post.withImage) && !imageUrl) return c.json({ error: `Episode ${index + 1} has no image URL.` }, 400);
                const scheduledAt = new Date(start.getTime() + index * intervalHours * 60 * 60 * 1000);
                const record: ScheduleRecord = {
                  id: crypto.randomUUID(), pageName, pageId: cfg.pageId, caption,
                  ...(imageUrl ? { imageUrl } : {}), withImage: Boolean(post.withImage),
                  scheduledAt: scheduledAt.toISOString(), status: "scheduled", createdAt: new Date().toISOString(),
                };
                await save(c.env, record);
                schedules.push(record);
              }
              return c.json({ ok: true, schedules }, 201);
            } catch (error) {
              return c.json({ error: "Series scheduling failed", details: error instanceof Error ? error.message : String(error) }, 500);
            }
          });

          '''
              if marker not in s:
                  raise SystemExit('Scheduler insertion marker not found; refusing to modify.')
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          p = Path('app/routes/autoposter.tsx')
          s = p.read_text()
          if 'async function scheduleSeries()' not in s:
              marker = '  function useSeriesPost(post: SeriesPost) {'
              block = r'''  async function scheduleSeries() {
            if (!series.length) return setStatus({ type: "error", text: "Generate the education series first." });
            const raw = window.prompt("Enter the series start date/time (for example: 2026-09-13 10:00)");
            if (!raw) return;
            const start = new Date(raw);
            if (Number.isNaN(start.getTime()) || start.getTime() <= Date.now() + 30_000) {
              return setStatus({ type: "error", text: "Enter a valid future start date/time." });
            }
            setBusy("series");
            setStatus({ type: "info", text: `Preparing ${series.length} visuals and schedules…` });
            try {
              const posts = [];
              for (let index = 0; index < series.length; index += 1) {
                const post = series[index];
                setStatus({ type: "info", text: `Generating visual ${index + 1}/${series.length}…` });
                const imageRes = await fetch("/api/autoposter/generate-image", {
                  method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ ...briefPayload, topic: `${topic} · ${post.title}`, imgPrompt: post.visualPrompt }),
                });
                const imageData: any = await imageRes.json();
                if (!imageRes.ok || !imageData.imageUrl) throw new Error(imageData.details || imageData.error || `Episode ${index + 1} visual failed`);
                posts.push({ caption: post.caption, imageUrl: imageData.imageUrl, withImage: true });
              }
              const scheduleRes = await fetch("/api/autoposter/schedules/series", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ page, startAt: start.toISOString(), intervalHours, posts }),
              });
              const scheduleData: any = await scheduleRes.json();
              if (!scheduleRes.ok) throw new Error(scheduleData.details || scheduleData.error || "Series scheduling failed");
              setShowSeries(false);
              setStatus({ type: "success", text: `${scheduleData.schedules?.length || series.length} posts scheduled successfully. Each visual uses the real ${page} branding.` });
            } catch (error) {
              setStatus({ type: "error", text: friendlyError(error) });
            } finally { setBusy(null); }
          }

  '''
              if marker not in s:
                  raise SystemExit('Series function marker not found; refusing to modify.')
              s = s.replace(marker, block + marker, 1)
          marker = '  return (\n    <main className="autoposter-shell min-h-screen text-[#171717]"><div className="mx-auto w-full max-w-[1380px] px-4 py-4 sm:px-6 lg:px-8 lg:py-6">'
          button = '''  return (\n    <main className="autoposter-shell min-h-screen text-[#171717]"><div className="mx-auto w-full max-w-[1380px] px-4 py-4 sm:px-6 lg:px-8 lg:py-6">\n      {series.length > 0 && <button className="fixed bottom-5 right-5 z-40 rounded-full bg-black px-5 py-3 text-sm font-semibold text-white shadow-2xl" onClick={scheduleSeries} disabled={!!busy}>Schedule full series</button>}'''
          if 'Schedule full series' not in s:
              if marker not in s:
                  raise SystemExit('Studio render marker not found; refusing to modify.')
              s = s.replace(marker, button, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/scheduler.ts app/routes/autoposter.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: auto-schedule education series"
          git push