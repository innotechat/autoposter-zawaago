name: Reel Lab Verify

on:
  push:
    branches: [feat/production-reel-studio]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: |
          test -f workers/reel-lab.ts
          test -f app/components/reel-composer-v2.tsx
          test -f app/reel-studio.css
          grep -q 'reelLabRoutes' workers/app.ts
          grep -q '/reel-lab/storyboard' workers/reel-lab.ts
          grep -q '/reel-lab/tts' workers/reel-lab.ts
          grep -q 'bulbul:v3' workers/reel-lab.ts
          grep -q 'SARVAM_API_KEY' workers/reel-lab.ts
          grep -q '@cf/myshell-ai/melotts' workers/reel-lab.ts
          grep -q 'MediaRecorder' app/components/reel-composer-v2.tsx
          grep -q 'video/mp4' app/components/reel-composer-v2.tsx
          grep -q 'Generate 4 Remaining Visuals' app/components/reel-composer-v2.tsx
          grep -q 'Create Reel Video' app/components/reel-composer-v2.tsx
          grep -q 'Download MP4' app/components/reel-composer-v2.tsx
          grep -q 'reel-composer-v2' app/routes/autoposter-branded.tsx
