name: Phase 2 Production Verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: |
          test -f workers/api.ts
          test -f workers/gallery.ts
          test -f workers/history.ts
          test -f workers/series.ts
          test -f workers/scheduler.ts
          test -f workers/series-scheduler.ts
          test -f workers/reel-lab.ts
          test -f workers/reels.ts
          test -f workers/facebook-health.ts
          test -f app/routes/gallery.tsx
          test -f app/routes/history.tsx
          test -f app/routes/schedule.tsx
          grep -q 'galleryRoutes' workers/app.ts
          grep -q 'historyRoutes' workers/app.ts
          grep -q 'seriesRoutes' workers/app.ts
          grep -q 'schedulerRoutes' workers/app.ts
          grep -q 'seriesSchedulerRoutes' workers/app.ts
          grep -q 'facebookHealthRoutes' workers/app.ts
          grep -q 'reelRoutes' workers/app.ts
          grep -q '/gallery/assets' workers/gallery.ts
          grep -q '/history' workers/history.ts
          grep -q '/autoposter/generate-series' workers/series.ts
          grep -q 'safeAssetKey' workers/gallery.ts
          grep -q 'writeHistory' workers/history.ts
          grep -q 'writeHistory' workers/api.ts
          grep -q 'ASSETS' workers/history.ts
          grep -q 'response_format' workers/series.ts
          grep -q 'startAt' app/routes/autoposter.tsx
          grep -q 'intervalHours' app/routes/autoposter.tsx
          grep -q 'seriesStartAt' app/routes/autoposter.tsx
          grep -q 'seriesIntervals' app/routes/autoposter.tsx
          grep -q 'video_reels' workers/reels.ts
          grep -q 'upload_phase' workers/reels.ts
          grep -q 'etagMatches' workers/scheduler.ts
          grep -q 'processingStartedAt' workers/scheduler.ts
          ! grep -q 'window.prompt' app/routes/autoposter.tsx
          ! grep -q 'FB_TOKEN?:' workers/api.ts
          ! grep -q 'env.FB_TOKEN[^_]' workers/api.ts
